<!--
  Page: 首页 / 扫描入口
  Purpose: App 首页，承接拍照识别入口、轻量会员提醒和最近一次本地识别记录。
  API:
    - GET /v1/safe-eat/me
    - GET /v1/safe-eat/membership/plans
  Auth: Authorization: Bearer {accessToken}
  Data Mapping:
    - 用户昵称/健康标签 <- me
    - 会员提醒 <- membership/plans + 当前用户权益
    - 最近识别卡片 <- 本地沙盒历史 SafeEatLocalHistory
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safe-Eat Prototype - Home</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./prototype-api.js"></script>
    <script type="module" src="./theme-toggle.js"></script>
  </head>
  <body>
    <main class="prototype-shell">
      <div class="phone-frame">
        <div class="screen">
          <div class="topbar home-topbar">
            <span class="eyebrow">Safe-Eat</span>
            <a class="privilege-bar" href="./membership.html">
              <span>新用户专享</span>
              <strong>29 元立减至 20 元</strong>
            </a>
          </div>

          <section class="home-hero">
            <div class="home-hero-copy">
              <h2 class="home-page-title">首页</h2>
              <div class="pill-row compact">
                <span class="pill">控糖友好</span>
                <span class="pill">本地历史</span>
              </div>
              <h1>今天这道菜，适不适合你继续吃？</h1>
            </div>
            <div class="home-hero-actions">
              <a class="button" href="./scan.html">开始扫描</a>
              <a class="button-secondary" href="./membership.html">看会员</a>
            </div>
          </section>

          <section class="section">
            <div class="section-headline">
              <h2 class="section-title">最近记录</h2>
              <span class="section-rule" aria-hidden="true"></span>
            </div>
            <article class="glass-card home-record-card">
              <div class="home-record-main">
                <div class="home-record-thumb" aria-hidden="true">
                  <div class="record-photo record-photo-cup"></div>
                </div>
                <div class="home-record-copy">
                  <div class="home-record-title-row">
                    <div class="stack">
                      <strong class="home-record-name">未识别食物</strong>
                      <span class="subcopy">本地图片 · 45 分钟前</span>
                    </div>
                    <span class="status-tag caution">信息不足</span>
                  </div>
                  <span class="home-record-score">衡量评分 45 · 疑似</span>
                  <p class="home-record-desc">当前仍缺少明确营养基线，建议继续补拍角度或打开卡片查看详情。</p>
                </div>
              </div>
              <a class="button full home-record-cta" href="./result.html">查看详情</a>
            </article>
          </section>
        </div>

        <nav class="tabbar">
          <a class="tab active" href="./home.html">首页</a>
          <a class="tab" href="./menu-month.html">菜单</a>
          <a class="tab" href="./profile.html">个人</a>
        </nav>
      </div>
    </main>
  </body>
</html>
