<!--
  Page: 菜单周视图 / Menu Week View
  Purpose: 以周为维度展示用户的饮食记录与食用表现概览，支持日期切换、通知提醒、三餐分段查看和周总览跳转
  API:
    - 无（本页默认使用本地历史）
  Auth: N/A（依赖端侧本地数据）
  Request:
    - 无
  Data Mapping:
    - 本地数据源 <- SafeEatLocalHistory
    - adviceLevel 聚合 -> 推荐/谨慎/不建议 统计
    - createdAt 小时 -> 早/午/晚餐分段
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safe-Eat Prototype - Menu Week</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./prototype-api.js"></script>
    <script type="module" src="./theme-toggle.js"></script>
    <style>
      /* ===== Week View Specific Styles ===== */

      .week-screen {
        padding-top: 20px;
      }

      /* Top Bar */
      .week-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .brand-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 13px;
        border-radius: 999px;
        background: var(--primary-soft);
        letter-spacing: 0.06em;
      }

      .brand-pill svg {
        width: 13px;
        height: 13px;
        fill: var(--primary);
      }

      .brand-pill span {
        font-size: 13px;
        font-weight: 700;
        color: var(--primary-deep);
      }

      .bell-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid var(--line);
        cursor: pointer;
        transition: all var(--motion-fast) ease;
      }

      .bell-btn.active {
        background: var(--primary-soft);
        border-color: rgba(46, 125, 90, 0.18);
      }

      .bell-btn.active svg {
        fill: var(--primary);
      }

      .bell-btn:hover {
        transform: scale(1.04);
      }

      .bell-btn:active {
        transform: scale(0.97);
      }

      .bell-dot {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--primary);
        opacity: 0;
        transition: opacity var(--motion-fast) ease;
      }

      .bell-btn.active .bell-dot {
        opacity: 1;
      }

      /* Week Range Title */
      .week-range-title {
        margin-bottom: 14px;
        font-family: var(--font-serif);
        font-size: 28px;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.02em;
      }

      /* Week Day Picker */
      .week-day-picker {
        display: flex;
        gap: 2px;
        margin-bottom: 20px;
      }

      .day-cell {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        transition: transform var(--motion-fast) ease;
      }

      .day-cell:hover {
        transform: translateY(-1px);
      }

      .day-cell:active {
        transform: scale(0.96);
      }

      .day-weekday {
        font-size: 12px;
        color: var(--ink-soft);
        transition: color var(--motion-fast) ease;
      }

      .day-number-wrap {
        position: relative;
        padding: 8px 12px;
        border-radius: 20px;
        transition: all var(--motion-fast) ease;
      }

      .day-cell.selected .day-number-wrap {
        background: var(--primary);
      }

      .day-cell.today-not-selected .day-number-wrap {
        /* no bg */
      }

      .day-number {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        transition: color var(--motion-fast) ease;
      }

      .day-cell.selected .day-number {
        color: #fff;
      }

      .day-today-tag {
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        padding: 2px 6px;
        border-radius: 999px;
        white-space: nowrap;
        transition: all var(--motion-fast) ease;
      }

      .day-today-tag.light {
        color: var(--primary);
        background: var(--primary-soft);
      }

      .day-today-tag.dark {
        color: rgba(255, 255, 255, 0.9);
        background: transparent;
      }

      .day-placeholder {
        height: 13px;
      }

      /* Performance Card */
      .perf-card {
        border-radius: 22px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 16px 36px rgba(41, 74, 57, 0.07);
        padding: 18px;
        margin-bottom: 18px;
      }

      .perf-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .perf-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #3d9b62;
      }

      .status-dot.warning { background: #d6a545; }
      .status-dot.danger { background: #c95b44; }

      .perf-exclaim {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: rgba(214, 165, 69, 0.12);
        margin-left: auto;
        cursor: pointer;
      }

      .perf-exclaim svg {
        fill: #d6a545;
      }

      .perf-summary {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 700;
        flex-wrap: wrap;
      }

      .perf-summary .rec { color: #3d9b62; }
      .perf-summary .cau { color: #c97a1a; }
      .perf-summary .avo { color: #c95b44; }

      .perf-bar-track {
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        display: flex;
        margin-bottom: 12px;
        position: relative;
      }

      .perf-bar-track::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 0.5px solid rgba(25, 52, 44, 0.08);
        pointer-events: none;
      }

      .perf-bar-segment {
        height: 100%;
        transition: width 0.4s ease;
      }

      .perf-bar-segment.rec { background: #3d9b62; }
      .perf-bar-segment.cau { background: #d6a545; }
      .perf-bar-segment.avo { background: #c95b44; }

      .perf-dots {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .perf-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
      }

      /* Meal Period Section */
      .meal-section {
        margin-bottom: 18px;
      }

      .meal-tabs {
        display: flex;
        gap: 20px;
        margin-bottom: 14px;
      }

      .meal-tab {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-soft);
        cursor: pointer;
        padding-bottom: 6px;
        position: relative;
        transition: color var(--motion-fast) ease;
      }

      .meal-tab.active {
        color: var(--primary);
      }

      .meal-tab.active::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2.5px;
        border-radius: 1.5px;
        background: var(--primary);
      }

      .food-scroll {
        display: flex;
        gap: 14px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }

      .food-scroll::-webkit-scrollbar {
        display: none;
      }

      .food-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        flex-shrink: 0;
        transition: transform var(--motion-fast) ease;
      }

      .food-card:hover {
        transform: translateY(-2px);
      }

      .food-img {
        width: 110px;
        height: 110px;
        border-radius: 20px;
        object-fit: cover;
        box-shadow: 0 8px 20px rgba(55, 47, 34, 0.1);
      }

      .food-name {
        font-size: 13px;
        color: var(--ink);
      }

      .meal-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 24px 0;
        border: 1px dashed var(--line);
        border-radius: 20px;
        text-align: center;
      }

      .meal-empty svg {
        width: 28px;
        height: 28px;
        opacity: 0.5;
      }

      .meal-empty p {
        font-size: 14px;
        color: var(--ink-soft);
        margin: 0;
      }

      /* Weekly Summary Card */
      .weekly-card {
        border-radius: 22px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: 0 16px 36px rgba(41, 74, 57, 0.07);
        padding: 18px;
        cursor: pointer;
        transition: transform var(--motion-fast) ease;
      }

      .weekly-card:hover {
        transform: translateY(-1px);
      }

      .weekly-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 14px;
      }

      .weekly-tags {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .wk-tag {
        display: inline-flex;
        align-items: center;
        font-size: 13px;
        font-weight: 700;
        padding: 7px 12px;
        border-radius: 999px;
      }

      .wk-tag.rec { color: #3d9b62; background: rgba(61, 155, 98, 0.12); }
      .wk-tag.cau { color: #c97a1a; background: rgba(214, 165, 69, 0.12); }
      .wk-tag.avo { color: #c95b44; background: rgba(201, 91, 68, 0.12); }

      /* Dark mode overrides */
      html[data-theme="dark"] .perf-card,
      html[data-theme="dark"] .weekly-card {
        background: rgba(29, 31, 37, 0.84);
      }

      html[data-theme="dark"] .bell-btn {
        background: rgba(33, 36, 42, 0.84);
        border-color: rgba(255, 255, 255, 0.08);
      }

      html[data-theme="dark"] .bell-btn.active {
        background: rgba(61, 122, 89, 0.18);
      }

      html[data-theme="dark"] .day-cell.selected .day-number-wrap {
        background: var(--primary);
      }

      html[data-theme="dark"] .meal-empty {
        border-color: rgba(235, 241, 238, 0.06);
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell">
      <div class="phone-frame" style="min-height: 900px;">
        <div class="screen week-screen">
          <!-- Top Bar -->
          <div class="week-topbar">
            <div class="brand-pill">
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              <span>SAFE-EAT</span>
            </div>

            <div class="bell-btn active" onclick="toggleBell(this)">
              <span class="bell-dot"></span>
              <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            </div>
          </div>

          <!-- Week Range Title -->
          <h2 class="week-range-title">4月21日 - 27日</h2>

          <!-- Week Day Picker -->
          <div class="week-day-picker">
            <div class="day-cell">
              <span class="day-weekday">日</span>
              <div class="day-number-wrap"><span class="day-number">21</span><div class="day-placeholder"></div></div>
            </div>
            <div class="day-cell today-not-selected">
              <span class="day-weekday">一</span>
              <div class="day-number-wrap"><span class="day-number">22</span><div class="day-placeholder"></div></div>
            </div>
            <div class="day-cell today-not-selected">
              <span class="day-weekday">二</span>
              <div class="day-number-wrap"><span class="day-number">23</span><div class="day-placeholder"></div></div>
            </div>
            <div class="day-cell selected">
              <span class="day-weekday" style="color: rgba(255,255,255,0.75);">三</span>
              <div class="day-number-wrap"><span class="day-number">24</span><span class="day-today-tag dark">今天</span></div>
            </div>
            <div class="day-cell today-not-selected">
              <span class="day-weekday">四</span>
              <div class="day-number-wrap"><span class="day-number">25</span><div class="day-placeholder"></div></div>
            </div>
            <div class="day-cell today-not-selected">
              <span class="day-weekday">五</span>
              <div class="day-number-wrap"><span class="day-number">26</span><div class="day-placeholder"></div></div>
            </div>
            <div class="day-cell today-not-selected">
              <span class="day-weekday">六</span>
              <div class="day-number-wrap"><span class="day-number">27</span><div class="day-placeholder"></div></div>
            </div>
          </div>

          <!-- Today Performance Card -->
          <article class="perf-card">
            <div class="perf-header">
              <span class="perf-title">今天素现中等</span>
              <span class="status-dot"></span>
              <div class="perf-exclaim">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
              </div>
            </div>
            <div class="perf-summary">
              <span class="rec">1 推荐</span>
              <span class="cau">1 谨慎</span>
              <span class="avo">1 不建议</span>
            </div>
            <div class="perf-bar-track">
              <div class="perf-bar-segment rec" style="width: 33.3%;"></div>
              <div class="perf-bar-segment cau" style="width: 33.3%;"></div>
              <div class="perf-bar-segment avo" style="width: 33.4%;"></div>
            </div>
            <div class="perf-dots">
              <span class="perf-dot" style="background: #3d9b62;"></span>
              <span class="perf-dot" style="background: #d6a545;"></span>
              <span class="perf-dot" style="background: #c95b44;"></span>
              <span class="perf-dot" style="background: rgba(77,154,114,0.5);"></span>
            </div>
          </article>

          <!-- Meal Period Section -->
          <section class="meal-section">
            <div class="meal-tabs">
              <div class="meal-tab active">早餐</div>
              <div class="meal-tab">午餐</div>
              <div class="meal-tab">晚餐</div>
            </div>

            <div class="food-scroll">
              <div class="food-card">
                <img class="food-img" src="" alt="沙拉" onerror="this.style.background='linear-gradient(140deg,rgba(47,122,87,0.14),rgba(212,223,178,0.08)),radial-gradient(circle at 30% 28%,rgba(255,255,255,0.96),rgba(229,239,233,0.9))'" />
                <span class="food-name">早餐</span>
              </div>
              <div class="food-card">
                <img class="food-img" src="" alt="面条" onerror="this.style.background='linear-gradient(145deg,#f1d9b4 0%,#f5e8d7 38%,#cf9e68 100%)'" />
                <span class="food-name">午餐</span>
              </div>
            </div>
          </section>

          <!-- Weekly Summary Card -->
          <article class="weekly-card">
            <h3 class="weekly-title">本周总览</h3>
            <div class="weekly-tags">
              <span class="wk-tag rec">推荐 2</span>
              <span class="wk-tag cau">谨慎 4</span>
              <span class="wk-tag avo">不建议 3</span>
            </div>
          </article>
        </div>

        <nav class="tabbar">
          <a class="tab" href="./home.html">&#x1F3E0;</a>
          <a class="tab active" href="#">周普校</a>
          <a class="tab" href="./profile.html">&#x1F464;</a>
        </nav>
      </div>
    </main>

    <script>
      function toggleBell(btn) {
        btn.classList.toggle('active');
      }

      // Tab switching demo
      document.querySelectorAll('.meal-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.meal-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
        });
      });

      // Day cell selection demo
      document.querySelectorAll('.day-cell').forEach(cell => {
        cell.addEventListener('click', function() {
          document.querySelectorAll('.day-cell').forEach(c => {
            c.classList.remove('selected');
            const tag = c.querySelector('.day-today-tag');
            if (tag) {
              tag.className = 'day-today-tag light';
              c.classList.add('today-not-selected');
            }
          });
          this.classList.add('selected');
          this.classList.remove('today-not-selected');
          const tag = this.querySelector('.day-today-tag');
          if (tag) tag.className = 'day-today-tag dark';

          // Update weekday color
          document.querySelectorAll('.day-cell').forEach(c => {
            c.querySelector('.day-weekday').style.color = '';
          });
          this.querySelector('.day-weekday').style.color = 'rgba(255,255,255,0.75)';
        });
      });
    </script>
  </body>
</html>
